<title>Everdawn — The Last Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07060b;color:#e8dcc0;font-family:'Roboto Condensed',Arial Narrow,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#boot{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2a1a10 0%,#0a0806 70%);z-index:100;transition:opacity .8s}
#boot .logo{position:absolute;top:30%;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-weight:900;font-size:clamp(40px,8vw,96px);letter-spacing:.08em;color:#f6d38a;text-shadow:0 0 30px rgba(255,150,40,.45),0 4px 0 #6a3a10}
#boot .logo small{display:block;font-size:.22em;letter-spacing:.5em;color:#c9a870;font-weight:500;margin-top:.4em;text-shadow:none}
#boot .bar{width:min(760px,80vw);margin-bottom:9vh}
#boot .tip{font-size:15px;color:#c8b58c;text-align:center;margin-bottom:12px;min-height:20px}
#boot .track{height:18px;border:2px solid #6b5530;border-radius:3px;background:#140e08;box-shadow:0 0 0 1px #000,inset 0 0 6px #000;overflow:hidden}
#boot .fill{height:100%;width:0;background:linear-gradient(#e0b04a,#9a6a18);box-shadow:inset 0 1px 0 #ffe7a0;transition:width .15s}
#boot .stage{font-size:12px;color:#8a7a5a;text-align:center;margin-top:8px;letter-spacing:.1em;text-transform:uppercase}
/*__CSS__*/
</style>
<div id="app"></div>
<div id="boot"><div class="logo">EVERDAWN<small>THE LAST SERVER</small></div><div class="bar"><div class="tip" id="boot-tip"></div><div class="track"><div class="fill" id="boot-fill"></div></div><div class="stage" id="boot-stage">Connecting to Lastlight…</div></div></div>
<script>/*__JS__*/</script>
